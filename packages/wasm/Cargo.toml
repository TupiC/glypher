[package]
name = "glypher-wasm"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
ttf-parser = "0.21"
flate2 = "1.0"
ttf2woff2 = "0.11.0"
fontcull-klippa = "0.1.2"
fontcull-write-fonts = { version = "0.44", features = ["read"] }
regex = "1.12.2"
deflate = "1.0.0"
reqwest = "0.13.1"
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lib]
crate-type = ["cdylib", "rlib"]
